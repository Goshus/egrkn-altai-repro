# params.yaml — параметры пайплайна ЕГРОКН-Алтай и ожидаемые значения

krai_bbox:           # ориентировочная рамка края для контроля координат
  lat_min: 49.0
  lat_max: 54.5
  lon_min: 76.0
  lon_max: 88.5

thresholds:
  fuzzy_match: 0.85          # SequenceMatcher: сшивка по наименованию (name_fuzzy_unique)
  name_mismatch_ratio: 1.0   # таблица 5: расхождение наименований (ratio < 1.0)
  name_low_similarity: 0.60  # таблица 5: сходство ниже 60/100 (ratio < 0.60)
  dup_max_m: 150.0           # дубликаты по нормализованному наименованию на расстоянии не более 150 м

pilots:
  - Солтонский
  - Красногорский
  - Змеиногорский

